spring:
  application:
    # Keep in sync with the git branch name so X-Ray / Jaeger service labels match the lab.
    name: adot-aws
  temporal:
    namespace: default
    connection:
      target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}
    workers-auto-discovery:
      packages:
        - click.yinsb.icmtracing.temporal.workflow
        - click.yinsb.icmtracing.temporal.activities

# Traces: OtelConfig → OTLP gRPC :4317 (ADOT)
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# Metrics: Micrometer (incl. Temporal SDK) → OTLP HTTP → ADOT → CloudWatch EMF
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      lab: adot-aws
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 15s
        resource-attributes:
          service.name: ${spring.application.name}
          service.namespace: icm-tracing
          deployment.environment: adot-aws
