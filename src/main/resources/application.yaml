spring:
  application:
    # Keep in sync with the git branch name so X-Ray / Transaction Search labels match the lab.
    name: adot-direct
  temporal:
    namespace: default
    connection:
      target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}
    workers-auto-discovery:
      packages:
        - click.yinsb.icmtracing.temporal.workflow
        - click.yinsb.icmtracing.temporal.activities

# Traces: ADOT Java Agent → SigV4 OTLP HTTP → X-Ray (see scripts/run-app-direct.sh).
# No local Collector on this branch — do not point OTel/Micrometer at :4317/:4318.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      lab: adot-direct
  otlp:
    metrics:
      export:
        # Collector-less lab: agent sets OTEL_METRICS_EXPORTER=none; keep Micrometer OTLP off.
        enabled: false
