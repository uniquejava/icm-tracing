# ADOT Collector config: Temporal/app OTLP → AWS X-Ray + CloudWatch (EMF) + local Jaeger
#
# Lab goal: validate Assessment Option B claim that platform components
# (Temporal) can ship traces/metrics to AWS via ADOT — independent of the
# AgentCore GenAI Observability path in the AWS blog (Python ADOT distro).
#
# Region is literal on purpose: ADOT image config expansion of ${AWS_REGION}
# was unreliable in this lab. Keep in sync with AWS_REGION in .env / startup.sh.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch/traces:
    timeout: 1s
    send_batch_size: 50
  batch/metrics:
    timeout: 30s
  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  # Traces → X-Ray PutTraceSegments. When the account's X-Ray destination is
  # CloudWatchLogs (Transaction Search), spans land in log group aws/spans —
  # aws xray get-trace-summaries may stay empty; that is expected.
  awsxray:
    region: eu-west-1

  # Metrics → CloudWatch via Embedded Metric Format
  awsemf:
    region: eu-west-1
    namespace: ICMTracing/Temporal
    log_group_name: /icm-tracing/otel/metrics
    dimension_rollup_option: NoDimensionRollup

  # Local dual-view (optional, no AWS needed)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch/traces]
      exporters: [awsxray, otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch/metrics]
      exporters: [awsemf, debug]
