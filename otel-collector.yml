receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/newrelic:
    endpoint: ${NR_ENDPOINT}
    headers:
      api-key: ${MY_NEW_RELIC_API_KEY}
  debug:
    verbosity: normal

processors:
  filter/drop_temporal_heartbeat_activity:
    error_mode: ignore
    traces:
      span:
        # Drop Temporal's StartActivity:RecordHeartbea and RunActivity:RecordHeartbeat so only custom "heartbeat" spans appear
        - 'name == "StartActivity:RecordHeartbeat"'
        - 'name == "RunActivity:RecordHeartbeat"'
  batch: {}

service:
  pipelines:
    traces/jaeger:
      receivers: [otlp]
      processors: [filter/drop_temporal_heartbeat_activity, batch]
      exporters: [otlp/jaeger]
    traces/nr:
      receivers: [otlp]
      processors: [filter/drop_temporal_heartbeat_activity, batch]
      exporters: [otlp/newrelic, debug]
