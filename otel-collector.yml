receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/newrelic:
    endpoint: ${NR_ENDPOINT}
    headers:
      api-key: ${MY_NEW_RELIC_API_KEY}
  datadog/exporter:
    api:
      site: ${DD_SITE}
      key: ${DD_API_KEY}
  debug:
    verbosity: normal

processors:
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

service:
  pipelines:
    traces/jaeger:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    traces/nr:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/newrelic, debug]
    traces/datadog:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog/exporter]
