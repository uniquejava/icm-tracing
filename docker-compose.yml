services:
  otel-collector:
    # AWS Distro for OpenTelemetry Collector (includes awsxray + awsemf exporters)
    image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.2
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "13133:13133"   # health_check
    environment:
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      # Static session keys from host `aws configure export-credentials` (do not set AWS_PROFILE)
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    volumes:
      - ./otel-collector.yml:/etc/otel-agent-config.yaml:ro
    command: ["--config=/etc/otel-agent-config.yaml"]
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.13.0
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"
      - "6831:6831/udp"
